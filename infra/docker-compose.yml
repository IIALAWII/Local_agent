services:
  chroma:
    image: chromadb/chroma:latest
    container_name: local-agent-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: local-agent-backend
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gpt-oss:20b
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    ports:
      - "8001:8001"
    depends_on:
      - chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: local-agent-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  chroma_data:
